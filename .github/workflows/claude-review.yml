name: Claude PR Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Claude ile PR incelemesi
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMARASI: ${{ github.event.pull_request.number }}

            Bu pull request'i incele. Odaklan:
            - Hatalar ve mantik sorunlari
            - Guvenlik aciklari
            - Veri tutarliligi ve veritabani islemleri
            - Kod kalitesi ve okunabilirlik
            - Eksik testler

            Yorumlari Turkce yaz, kisa ve somut ol; mumkunse duzeltme oner.
            Satira ozgu sorunlar icin inline yorum, genel degerlendirme icin
            tek bir PR yorumu kullan.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*)"
